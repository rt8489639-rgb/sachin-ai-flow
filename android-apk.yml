name: Build SACHIN AI FLOW Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check deployment URL
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "Set GitHub repository variable APP_URL to your deployed HTTPS app URL."
            exit 1
          fi
          sed -i "s#https://YOUR-DEPLOYED-APP-URL#${{ vars.APP_URL }}#g" capacitor.config.ts
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SACHIN-AI-FLOW-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
